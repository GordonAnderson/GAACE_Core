[platformio]
# Tells PlatformIO to build the example, pulling in the repo root (this
# library's own library.json) as a regular library dependency.
default_envs = adafruit_feather_m0
src_dir = examples/DiagnosticDemo/src

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
lib_deps =
    symlink://.

; Regression tests (test/) for ringBuffer/charAllocate/commandProcessor.
; Runs on real hardware -- the actual Arduino Stream/String classes
; GAACE_Core is built on, not a native shim -- via:
;   pio test -e adafruit_qt_py_m0 --upload-port <port>
[env:adafruit_qt_py_m0]
platform = atmelsam
board = adafruit_qt_py_m0
framework = arduino
lib_deps =
    symlink://.
    throwtheswitch/Unity@^2.6.1